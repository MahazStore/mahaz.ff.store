<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHAZ STORE</title>
<style>
body{margin:0;background:#07070b;color:#fff;font-family:Arial}.wrap{max-width:800px;margin:auto;padding:20px}h1{text-align:center;color:#f01830}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card,.box{background:#14141e;border:1px solid #4b1019;border-radius:16px;padding:20px;text-align:center}.diamond{font-size:27px}.price{font-size:24px;color:#39e56d;font-weight:bold;margin:10px}button{background:#f01830;color:#fff;border:0;border-radius:9px;padding:12px 20px;font-weight:bold}input{width:100%;padding:13px;box-sizing:border-box;margin:8px 0;background:#09090f;color:#fff;border:1px solid #555;border-radius:9px}.jazz{background:#07120a;border:1px solid #16b84e;padding:15px;border-radius:12px}.jnum{font-size:25px;color:#39e56d;font-weight:bold}#order{display:none;margin-top:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>🔥 FREE FIRE TOP UP</h1>
<p style="text-align:center">Select your Diamond package</p><div class="grid">
<div class="card"><div class="diamond">💎 70 Diamonds</div><div class="price">Rs 99</div><button onclick="choose('70 Diamonds','Rs 99')">Select</button></div>
<div class="card"><div class="diamond">💎 140 Diamonds</div><div class="price">Rs 199</div><button onclick="choose('140 Diamonds','Rs 199')">Select</button></div>
<div class="card"><div class="diamond">💎 355 Diamonds</div><div class="price">Rs 499</div><button onclick="choose('355 Diamonds','Rs 499')">Select</button></div>
<div class="card"><div class="diamond">💎 720 Diamonds</div><div class="price">Rs 999</div><button onclick="choose('720 Diamonds','Rs 999')">Select</button></div></div>
<div id="order" class="box"><h2 id="chosen"></h2><input id="pid" placeholder="Free Fire Player ID"><button onclick="pay()">Continue to Order</button>
<div id="payment" style="display:none;margin-top:18px"><div class="jazz"><b>🟢 JazzCash Payment</b><p>Send payment to:</p><div class="jnum">03155192240</div></div>
<p>Transaction screenshot upload karein:</p><input id="proof" type="file" accept="image/*"><button onclick="submitProof()">Submit Payment Proof</button><p id="msg"></p></div></div></div>
<script>
let pkg='',price='';
function choose(a,b){pkg=a;price=b;document.getElementById('order').style.display='block';document.getElementById('chosen').textContent='💎 '+a+' — '+b;document.getElementById('order').scrollIntoView({behavior:'smooth'})}
function pay(){if(!document.getElementById('pid').value.trim()){alert('Player ID enter karein');return}document.getElementById('payment').style.display='block'}
function submitProof(){let f=document.getElementById('proof').files[0];if(!f){alert('Transaction screenshot upload karein');return}document.getElementById('msg').textContent='Proof selected: '+f.name+'. Actual server upload ke liye backend deploy karna hoga.'}
</script></body></html>
